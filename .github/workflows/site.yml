name: Deploy site (Cloudflare Pages)
# Страница Inventa на Cloudflare Pages: https://inventa.pages.dev
# Нужен секрет репозитория CLOUDFLARE_API_TOKEN (права: Account → Cloudflare Pages → Edit).
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-deploy
  cancel-in-progress: true
env:
  CLOUDFLARE_ACCOUNT_ID: 9b400b74f4caff725b658e53493d1f78
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PROJECT: inventa
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Добавьте секрет CLOUDFLARE_API_TOKEN: Settings → Secrets and variables → Actions"
            exit 1
          fi
      # Создаёт проект при первом запуске; если он уже есть, шаг ничего не меняет
      - name: Create Pages project (first run)
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
