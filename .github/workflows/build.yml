name: Build Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python make_version_info.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Inventa --add-data "VERSION;." --add-data "app.ico;." --icon app.ico --version-file version_info.txt bohemia_gui.py
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          # копия под старым именем: версии 1.2.x (ещё Bohemia Photos) ищут в релизе именно этот файл
          Copy-Item dist/Inventa-Setup.exe dist/BohemiaPhotos-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Inventa
          path: |
            dist/Inventa.exe
            dist/Inventa-Setup.exe
      # Релиз = версия из файла VERSION. Повторная сборка той же версии обновляет файлы релиза.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Inventa ${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/Inventa.exe
            dist/Inventa-Setup.exe
            dist/BohemiaPhotos-Setup.exe
