name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name BohemiaPhotos bohemia_gui.py
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BohemiaPhotos
          path: |
            dist/BohemiaPhotos.exe
            dist/BohemiaPhotos-Setup.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bohemia Photos 1.0.${{ github.run_number }}
          files: |
            dist/BohemiaPhotos.exe
            dist/BohemiaPhotos-Setup.exe
