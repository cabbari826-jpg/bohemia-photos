name: Build Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python make_version_info.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Inventa --add-data "VERSION;." --add-data "app.ico;." --collect-all tkinterdnd2 --icon app.ico --version-file version_info.txt bohemia_gui.py
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          # копия под старым именем: версии 1.2.x (ещё Bohemia Photos) ищут в релизе именно этот файл
          Copy-Item dist/Inventa-Setup.exe dist/BohemiaPhotos-Setup.exe
      # Проверка обновления как из программы: ставим прошлый релиз, запускаем его и ставим новый поверх
      - name: Update test
        shell: pwsh
        run: |
          $old = "$env:RUNNER_TEMP\old-setup.exe"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/latest/download/Inventa-Setup.exe" -OutFile $old
          Start-Process $old -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Inventa"
          $exe = "$dir\Inventa.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem $env:LOCALAPPDATA\Programs -Recurse -Depth 1 | Out-String | Write-Host; throw "old version not installed" }
          Write-Host "old:" (Get-Item $exe).VersionInfo.FileVersion
          $app = Start-Process $exe -PassThru
          Start-Sleep 8
          $log = "$env:RUNNER_TEMP\upd.log"
          $p = Start-Process dist\Inventa-Setup.exe -ArgumentList '/SP-','/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/NOCANCEL',"/LOG=$log" -PassThru
          Start-Sleep 5   # установщик должен дождаться, пока программа закроется
          # программа сама выходит после запуска установщика (у onefile-exe два процесса)
          Get-Process Inventa -ErrorAction SilentlyContinue | Stop-Process -Force
          $p.WaitForExit(180000) | Out-Null
          Get-Content $log -Tail 25
          $v = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "new:" $v "exit:" $p.ExitCode
          Get-Process Inventa -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $v.StartsWith($env:APP_VERSION)) { throw "update did not replace Inventa.exe ($v)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Inventa
          path: |
            dist/Inventa.exe
            dist/Inventa-Setup.exe
      # Релиз = версия из файла VERSION. Повторная сборка той же версии обновляет файлы релиза.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Inventa ${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/Inventa.exe
            dist/Inventa-Setup.exe
            dist/BohemiaPhotos-Setup.exe
