name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name BohemiaPhotos bohemia_gui.py
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $env:APP_VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.${env:GITHUB_RUN_NUMBER}" }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BohemiaPhotos
          path: |
            dist/BohemiaPhotos.exe
            dist/BohemiaPhotos-Setup.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Bohemia Photos ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
          body_path: ${{ github.ref_type == 'tag' && 'RELEASE_NOTES.md' || '' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            dist/BohemiaPhotos.exe
            dist/BohemiaPhotos-Setup.exe
